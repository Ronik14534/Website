<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Website</title>

  <!-- Linking the external CSS file for styling -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main header section with title and introduction -->
  <header>
    <h1>Welcome to My Website!</h1>
    <p>Hi, I'm building my very own site hosted on GitHub Pages.</p>
  </header>

  <!-- Main content section -->
  <main>
    <section class="card">
      <h2>About Me</h2>
      <p>I am passionate about learning web development and creating cool projects.</p>
      
      <!-- Interactive button that triggers JavaScript -->
      <button id="interactiveBtn">Click For A Surprise!</button>
      
      <!-- Container where dynamic message will appear -->
      <p id="dynamicMessage"></p>
    </section>
  </main>

  <!-- Footer section for copyright or social links -->
  <footer>
    <p>&copy; 2026 Built with HTML, CSS, and JavaScript.</p>
  </footer>

  <!-- Linking the external JavaScript file at the end of the body for fast page loading -->
  <script src="script.js"></script>
</body>
</html>
