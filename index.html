<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect 4 Game | My Personal Website</title>

  <!-- Linking the external CSS file for styling -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header section with site title -->
  <header>
    <h1>Connect 4 Arcade</h1>
    <p>Play a classic game of Connect 4 right in your browser!</p>
  </header>

  <!-- Main section holding the game workspace -->
  <main>
    <section class="game-container">
      <!-- Dynamic status text showing current player turn or winner message -->
      <h2 id="status">Player <span id="current-player-text" class="red-turn">Red</span>'s Turn</h2>
      
      <!-- Connect 4 Game Board Grid (6 rows x 7 columns generated dynamically) -->
      <div id="board"></div>

      <!-- Action button to reset or play again -->
      <button id="reset-btn">Reset Game</button>
    </section>
  </main>

  <!-- Footer section -->
  <footer>
    <p>&copy; 2026 Built with HTML, CSS, and JavaScript.</p>
  </footer>

  <!-- External JavaScript file for game engine logic -->
  <script src="script.js"></script>
</body>
</html>
